<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سؤال مهم 😂</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
margin:0;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#dbeafe,#fef3c7);
overflow:hidden;
}

.box{
text-align:center;
width:100%;
}

h1{
font-size:35px;
color:#333;
animation:pulse 1.5s infinite;
}

.buttons{
position:relative;
width:90%;
max-width:350px;
height:170px;
margin:auto;
}

button{
padding:15px 35px;
font-size:22px;
border:0;
border-radius:20px;
cursor:pointer;
box-shadow:0 5px 15px #999;
}

#yes{
background:#22c55e;
color:white;
}

#no{
background:#ef4444;
color:white;
position:absolute;
left:210px;
top:20px;
}


#answer{
display:none;
font-size:35px;
color:#16a34a;
animation:show .7s;
}


.emoji{
position:fixed;
font-size:35px;
animation:fall 3s linear forwards;
}


@keyframes fall{

from{
transform:translateY(0) rotate(0);
opacity:1;
}

to{
transform:translateY(100vh) rotate(360deg);
opacity:0;
}

}


@keyframes show{

from{
transform:scale(.3);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}


@keyframes pulse{

50%{
transform:scale(1.05);
}

}

</style>

</head>

<body>


<div class="box">


<div id="question">

<h1>
😂 هتخس ولا لا؟
</h1>


<div class="buttons">

<button id="yes">
أيوه 💪
</button>


<button id="no">
لا 😂
</button>


</div>

</div>



<div id="answer">

😂 بطل طفح 💪🔥
<br><br>
دلوقتي مفيش أعذار 😎

</div>


</div>



<script>

const no=document.getElementById("no");
const yes=document.getElementById("yes");


function moveNo(){

let x=Math.random()*(window.innerWidth-130);
let y=Math.random()*(window.innerHeight-80);

no.style.position="fixed";
no.style.left=x+"px";
no.style.top=y+"px";

}


no.addEventListener("mouseover",moveNo);

no.addEventListener("touchstart",function(e){
e.preventDefault();
moveNo();
});

no.addEventListener("click",moveNo);



yes.onclick=function(){

document.getElementById("question").style.display="none";

document.getElementById("answer").style.display="block";


for(let i=0;i<40;i++){

setTimeout(createEmoji,i*50);

}

};



function createEmoji(){

let e=document.createElement("div");

e.className="emoji";

let arr=["🔥","💪","😂","⭐","🥗"];

e.innerHTML=arr[Math.floor(Math.random()*arr.length)];

e.style.left=Math.random()*window.innerWidth+"px";

e.style.top="-50px";

document.body.appendChild(e);


setTimeout(()=>{

e.remove();

},3000);

}


</script>


</body>
</html>
