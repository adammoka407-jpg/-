```html
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ سؤال صغير</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd1e8,#fff0f6);
overflow:hidden;
}

.container{
text-align:center;
padding:20px;
}

h1{
font-size:38px;
color:#ff2f72;
margin-bottom:40px;
}

.buttons{
position:relative;
width:340px;
height:120px;
margin:auto;
}

button{
padding:15px 30px;
font-size:22px;
border:none;
border-radius:15px;
cursor:pointer;
transition:.25s;
}

#yes{
background:#ff4d88;
color:white;
}

#no{
position:absolute;
left:220px;
top:0;
background:#ddd;
}

#success{
display:none;
animation:fade .6s;
}

#success h2{
font-size:42px;
color:#ff2f72;
margin-bottom:20px;
}

.choice{
margin-top:20px;
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}

.choice button{
background:#ff6fa5;
color:white;
}

#final{
display:none;
margin-top:35px;
font-size:30px;
color:#ff2f72;
animation:fade .5s;
}

.heart{
position:fixed;
font-size:24px;
animation:float 4s linear forwards;
pointer-events:none;
}

@keyframes float{
0%{
transform:translateY(0) scale(1);
opacity:1;
}
100%{
transform:translateY(-100vh) scale(2);
opacity:0;
}
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}
</style>
</head>

<body>

<div class="container">

<div id="question">

<h1>❤️ هتنزلي ديت معايا؟ ❤️</h1>

<div class="buttons">

<button id="yes">
Yes ❤️
</button>

<button id="no">
No 🙈
</button>

</div>

</div>

<div id="success">

<h2>❤️ كنت عارف ❤️</h2>

<p style="font-size:23px;margin-bottom:25px;">
إمتى تحبي يكون الديت؟
</p>

<div class="choice">

<button onclick="finish('الأسبوع الجاي')">
📅 الأسبوع الجاي
</button>

<button onclick="finish('الأسبوع اللي بعده')">
🌸 الأسبوع اللي بعده
</button>

</div>

<div id="final"></div>

</div>

</div>

<script>

const no=document.getElementById("no");
const yes=document.getElementById("yes");

let size=1;

function move(){

const x=Math.random()*(window.innerWidth-120);

const y=Math.random()*(window.innerHeight-70);

no.style.position="fixed";
no.style.left=x+"px";
no.style.top=y+"px";

size+=0.12;

yes.style.transform=`scale(${size})`;

}

no.addEventListener("mouseover",move);
no.addEventListener("click",move);

yes.onclick=function(){

document.getElementById("question").style.display="none";

document.getElementById("success").style.display="block";

setInterval(heart,180);

}

function finish(date){

document.getElementById("final").style.display="block";

document.getElementById("final").innerHTML=
`تم الاتفاق على <b>${date}</b><br><br>🌹 أراكِ لاحقًا ❤️`;

}

function heart(){

const h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*window.innerWidth+"px";

h.style.top=window.innerHeight+"px";

h.style.fontSize=(20+Math.random()*25)+"px";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},4000);

}

</script>

</body>
</html>
