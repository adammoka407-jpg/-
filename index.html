<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ سؤال صغير</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd1e8,#fff0f6);
    overflow:hidden;
}

.container{
    text-align:center;
    padding:20px;
}

h1{
    color:#ff2f72;
    font-size:35px;
    margin-bottom:40px;
}

.buttons{
    position:relative;
    width:340px;
    height:120px;
    margin:auto;
}

button{
    border:none;
    border-radius:15px;
    padding:15px 30px;
    font-size:20px;
    cursor:pointer;
    transition:.25s;
}

#yes{
    background:#ff4d88;
    color:white;
}

#no{
    position:absolute;
    left:220px;
    top:0;
    background:#ddd;
}

#success{
    display:none;
    animation:fade .5s;
}

#success h2{
    color:#ff2f72;
    font-size:40px;
    margin-bottom:25px;
}

.choice{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.choice button{
    background:#ff6fa5;
    color:white;
}

#final{
    display:none;
    margin-top:30px;
    font-size:28px;
    color:#ff2f72;
}

.heart{
    position:fixed;
    pointer-events:none;
    animation:float 4s linear forwards;
}

@keyframes float{

0%{
    transform:translateY(0) scale(1);
    opacity:1;
}

100%{
    transform:translateY(-100vh) scale(2);
    opacity:0;
}

}

@keyframes fade{

from{
    opacity:0;
    transform:scale(.8);
}

to{
    opacity:1;
    transform:scale(1);
}

}

</style>

</head>

<body>

<div class="container">

<div id="question">

<h1>
❤️ هتنزلي ديت معايا؟ ❤️
</h1>

<div class="buttons">

<button id="yes">
Yes ❤️
</button>

<button id="no">
No 🙈
</button>

</div>

</div>
<div id="success">

<h2>
❤️ كنت عارف ❤️
</h2>

<p style="font-size:22px;margin-bottom:25px;">
إمتى تحبي يكون الديت؟
</p>

<div class="choice">

<button onclick="finish('الأسبوع الجاي')">
📅 الأسبوع الجاي
</button>

<button onclick="finish('الأسبوع اللي بعده')">
🌸 الأسبوع اللي بعده
</button>

</div>

<div id="final"></div>

</div>

</div>


<script>

const no = document.getElementById("no");
const yes = document.getElementById("yes");

let size = 1;

function move(){

let x = Math.random() * (window.innerWidth - 120);
let y = Math.random() * (window.innerHeight - 70);

no.style.position = "fixed";
no.style.left = x + "px";
no.style.top = y + "px";

size += 0.12;

yes.style.transform = `scale(${size})`;

}


// للكمبيوتر
no.addEventListener("mouseover", move);

// للموبايل
no.addEventListener("touchstart", move);

// احتياط لو ضغط عادي
no.addEventListener("click", move);


yes.onclick = function(){

document.getElementById("question").style.display = "none";

document.getElementById("success").style.display = "block";

setInterval(createHeart,180);

};


function finish(date){

document.getElementById("final").style.display = "block";

document.getElementById("final").innerHTML =
`
تم الاتفاق على <b>${date}</b> ❤️
<br><br>
🌹 أراكِ لاحقًا
`;

}



function createHeart(){

let heart = document.createElement("div");

heart.className = "heart";

heart.innerHTML = "❤️";

heart.style.left = Math.random()*window.innerWidth + "px";

heart.style.top = window.innerHeight + "px";

heart.style.fontSize = 
(20 + Math.random()*30) + "px";


document.body.appendChild(heart);


setTimeout(()=>{

heart.remove();

},4000);

}

</script>

</body>
</html>
